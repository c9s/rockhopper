version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions — keep workflow actions current, grouped into one PR per run.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * MON,THU"
      timezone: "Asia/Taipei"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "DEP"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Go modules — version-update PRs are disabled (open-pull-requests-limit: 0);
  # Dependabot still opens security updates, which are grouped into one PR.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 2 * * MON,THU"
      timezone: "Asia/Taipei"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "DEP"
    labels:
      - "dependencies"
      - "go"
    open-pull-requests-limit: 0
    groups:
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"
