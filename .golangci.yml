version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - staticcheck
    - bodyclose
    - contextcheck
    - dupword
    - decorder
    - goconst
    - govet
    - gosec
    - misspell
  settings:
    goconst:
      # Dialect SQL type names and expressions stay literal so each dialect's
      # type mapping reads as a table; equal spellings across dialects are
      # independent choices, not shared values.
      ignore-string-values:
        - '^(TEXT|TIMESTAMP|NOW\(\))$'
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
